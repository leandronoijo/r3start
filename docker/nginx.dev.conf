map $request_method $auth_upstream {
    GET     http://web:5173;
    HEAD    http://web:5173;
    default http://api:3000;
}

server {
    listen 80;
    # Keep slash-normalization redirects relative so Docker's published 8080 port is retained.
    absolute_redirect off;

    # API and authentication stay on the browser's origin during development.
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://api:3000;
    }

    location /auth/ {
        # React renders auth pages; SuperTokens form submissions use POST and reach Nest.
        proxy_set_header Host $http_host;
        proxy_pass $auth_upstream;
    }

    location /health/ {
        proxy_set_header Host $http_host;
        proxy_pass http://api:3000;
    }

    location /docs/ {
        proxy_set_header Host $http_host;
        proxy_pass http://api:3000;
    }

    # Vite serves the application shell and hot-reload client.
    location / {
        proxy_set_header Host $http_host;
        proxy_pass http://web:5173;
    }
}
